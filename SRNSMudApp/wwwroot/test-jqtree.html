<!DOCTYPE html>
<html lang="ja">
<head>
    <title>test-jqtree</title>
    <!--suppress JSUnresolvedLibraryURL -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jqtree/1.6.3/jqtree.css" rel="stylesheet">
</head>
<body>
<div id="tree"></div>
<!--suppress JSUnresolvedLibraryURL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!--suppress JSUnresolvedLibraryURL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jqtree/1.6.3/tree.jquery.js"></script>
<script>
    const data = [
        {
            id: 1,
            name: "Root",
            children: [
                {id: 2, name: "Child1"},
                {id: 3, name: "Child2"}
            ]
        }
    ];
    $('#tree').tree({
        data,
        autoOpen: true
    });
</script>
</body>
</html>
